name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 草稿 Release 的 tag（留空则用 v<版本>-ci.<运行号>，不会和正式版冲突）
        required: false
        default: ''
      packaged_test:
        description: 打包后跑 test:packaged 验收
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    env:
      PI_VERSION: '1.5.2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve version and tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "tag $tag 与 package.json 版本 $version 不一致" >&2
              exit 1
            fi
          else
            tag="$INPUT_TAG"
            [ -n "$tag" ] || tag="v$version-ci.$GITHUB_RUN_NUMBER"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "tag 只能含字母、数字、点、下划线和连字符：$tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Bundle pi runtime
        run: |
          npm install -g "@earendil-works/pi-coding-agent@$PI_VERSION"
          YAN_PI_SRC="$(npm root -g)/@earendil-works/pi-coding-agent" npm run vendor:pi

      - run: npm run vendor:search-tools

      - run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (release gate)
        run: npm run test:unit

      - name: Package
        run: npx electron-builder --win --publish never

      - name: Packaged acceptance
        if: github.event_name == 'push' || inputs.packaged_test
        run: node scripts/test-packaged.mjs

      - name: Assemble release assets
        run: node scripts/release-assets.mjs release/public

      - uses: actions/upload-artifact@v4
        with:
          name: inkstone-${{ steps.meta.outputs.version }}-windows
          path: release/public
          retention-days: 7

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          notes="CI 构建（提交 ${GITHUB_SHA::8}，运行 $GITHUB_RUN_ID）。草稿：核对资产、补写更新说明后再发布。安装包未签名。"
          gh release create "$RELEASE_TAG" release/public/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Inkstone $RELEASE_VERSION" \
            --notes "$notes"

  android:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::没有配置 APK 签名密钥（ANDROID_KEYSTORE_BASE64 等），跳过手机安装包"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        if: steps.signing.outputs.ready == 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          npm ci --prefix mobile

      - name: Build signed APK
        if: steps.signing.outputs.ready == 'true'
        env:
          INKSTONE_PREBUILT_ASSETS: '1'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dir="$RUNNER_TEMP/inkstone-signing"
          mkdir -p "$dir"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=$dir/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > "$dir/keystore.properties"
          INKSTONE_SIGNING="$dir/keystore.properties" node mobile/scripts/build-apk.mjs
          rm -rf "$dir"

      - name: Attach APK to draft release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.windows.outputs.tag }}
        run: |
          apk=$(ls release/apk-*/Inkstone-mobile-*.apk | grep -v debug-signed | head -1)
          [ -n "$apk" ] || { echo "没有找到正式签名的 APK" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "$apk" --clobber
