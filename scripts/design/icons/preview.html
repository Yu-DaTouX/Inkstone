<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Reicon 图标集 · pi desktop</title>
<style>
:root{
  --bg:#0b0b0d;--bg2:#121215;--bg3:#17171b;--bd:#26262c;--bd2:#34343c;
  --fg:#d6d6dd;--dim:#a8a8b5;--mute:#82828f;
  --ac:#7aa2f7;--ok:#9ece6a;--warn:#e0af68;--err:#f7768e;--mag:#bb9af7;--cy:#7dcfff;
}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);
  font:12px/1.5 "Maple Mono CN","Cascadia Code",ui-monospace,monospace;-webkit-font-smoothing:antialiased}
h1{font-size:14px;margin:0 0 4px;font-weight:600}
.sub{color:var(--mute);margin:0 0 20px}
.grp{margin-bottom:22px}
.grp h2{font-size:12px;font-weight:600;color:var(--dim);margin:0 0 8px;
  padding-bottom:6px;border-bottom:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cell{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:10px 8px;
  display:flex;flex-direction:column;align-items:center;gap:7px;transition:border-color 120ms}
.cell:hover{border-color:var(--bd2)}
.ico{width:22px;height:22px;color:var(--fg);fill:none;flex:none}
.cell:hover .ico{color:var(--ac)}
.nm{font-size:10px;color:var(--mute);text-align:center;word-break:break-all;line-height:1.3}
.sizes{display:flex;gap:26px;align-items:flex-end;background:var(--bg2);border:1px solid var(--bd);
  border-radius:8px;padding:18px;margin-bottom:22px;flex-wrap:wrap}
.szbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.szbox .lbl{font-size:10px;color:var(--mute)}
.colors{display:flex;gap:20px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;
  padding:16px;margin-bottom:22px;flex-wrap:wrap;align-items:center}
.colors .ico{width:20px;height:20px}
</style>

<script>
const ALIAS = {"search":"search","plus":"plus","minus":"minus","x":"x","check":"check","chevron-down":"chevron-down","chevron-right":"chevron-right","chevron-left":"chevron-left","chevron-up":"chevron-up","more-horizontal":"more","menu":"menu","sidebar-left":"sidebar-left","sidebar-right":"sidebar-right","folder":"folder","folder-open":"folder-open","folder-add":"folder-add","file":"file","file-text":"file-text","file-check":"file-check","file-minus":"file-minus","tree":"tree","list-check":"list-check","checklist":"checklist","git-branch":"branch-down","git-commit":"branch-down","git-merge":"branch-up","git-pull-request":"send","branch-down":"branch-down","branch-up":"branch-up","refresh":"refresh","undo":"undo","history":"history","terminal-square":"terminal-square","terminal-circle":"terminal-circle","command":"command","code":"code","code-file":"code-file","play":"play","stop":"stop","pause":"pause","loader":"loader","zap":"flash","flash":"flash","clock":"clock","check-circle":"check-circle","close-circle":"close-circle","alert-triangle":"alert-triangle","alert-circle":"alert-circle","info-circle":"info-circle","information":"information","shield-check":"shield-check","edit":"edit","copy":"copy","clipboard":"clipboard","trash":"trash","eye":"eye","filter":"filter","sort":"sort","layers":"layers","box":"box","package":"package","coin":"coin","coins":"coins","wallet":"wallet","receipt":"receipt","tag":"tag","activity":"activity","trending-up":"activity","cpu-charge":"cpu-charge","cpu":"cpu","settings":"settings","sliders":"sliders","sun":"sun","moon":"moon","globe":"globe","language":"language","translate":"translate","maximize":"maximize","minimize":"minimize","expand":"expand","layout":"layout","drag":"arrange-square","arrange-square":"arrange-square","sparkle":"sparkle","sparkles":"sparkles","brain":"sparkle","message-dots":"message-dots","message-circle":"message-circle","chat-round":"chat-round","send":"send","message":"message","magic":"sparkle"};
const GROUPS = {"nav 导航":["search","plus","minus","x","check","chevron-down","chevron-right","chevron-left","chevron-up","more-horizontal","menu","sidebar-left","sidebar-right"],"folder 文件夹":["folder","folder-open","folder-add","file","file-text","file-check","file-minus","tree","list-check","checklist"],"vcs 版本控制":["git-branch","git-commit","git-merge","git-pull-request","branch-down","branch-up","refresh","undo","history"],"run 运行":["terminal-square","terminal-circle","command","code","code-file","play","stop","pause","loader","zap","flash","clock"],"state 状态":["check-circle","close-circle","alert-triangle","alert-circle","info-circle","information","shield-check"],"edit 编辑":["edit","copy","clipboard","trash","eye","filter","sort","layers","box","package"],"cost 计费":["coin","coins","wallet","receipt","tag","activity","trending-up","cpu-charge","cpu"],"ui 界面":["settings","sliders","sun","moon","globe","language","translate","maximize","minimize","expand","layout","drag","arrange-square"],"ai 模型":["sparkle","sparkles","brain","message-dots","message-circle","chat-round","send","message","magic"]};
const ICON_COUNT = 166;

const svg = (id, cls) => `<svg class="ico ${cls||""}"><use href="#${id}"/></svg>`;

// 尺寸示例
document.querySelector("#sizes").innerHTML = [12,14,16,18,20,24,32].map(s =>
  `<div class="szbox"><div style="height:34px;display:flex;align-items:center">` +
  `<svg class="ico" style="width:${s}px;height:${s}px"><use href="#i-terminal-square"/></svg></div>` +
  `<span class="lbl">${s}px</span></div>`).join("") +
  `<div class="szbox"><div style="height:34px;display:flex;align-items:center">` +
  `<svg class="ico" style="width:20px;height:20px"><use href="#i-terminal-square-f"/></svg></div>` +
  `<span class="lbl">Filled</span></div>`;

// 颜色示例
document.querySelector("#colors").innerHTML =
  [["--fg","前景"],["--dim","次要"],["--mute","弱化"],["--ac","进行中"],["--ok","成功"],
   ["--warn","警告"],["--err","失败"],["--mag","分支"],["--cy","行内代码"]].map(([v,l]) =>
  `<div class="szbox">${svg("i-shield-check").replace('class="ico "','class="ico" style="color:var('+v+')"')}` +
  `<span class="lbl">${l}</span></div>`).join("");

// 分组网格
const out = document.querySelector("#out");
for (const [g, names] of Object.entries(GROUPS)) {
  const items = names.filter(n => ALIAS[n]).map(n => {
    const id = "i-" + ALIAS[n];
    return `<div class="cell" title="${n}  →  ${ALIAS[n]}">` +
      `<svg class="ico"><use href="#${id}"/></svg>` +
      `<span class="nm">${ALIAS[n]}</span></div>`;
  }).join("");
  out.insertAdjacentHTML("beforeend",
    `<div class="grp"><h2>${g} · ${names.filter(n=>ALIAS[n]).length}</h2><div class="grid">${items}</div></div>`);
}
document.title = "DONE " + Object.keys(ALIAS).length + " icons / " + ICON_COUNT + " symbols";
</script>
