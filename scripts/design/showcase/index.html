<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inkstone · 让想法成形</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151515;color:#ecece8;font-family:'Segoe UI','Microsoft YaHei UI',sans-serif;display:grid;min-height:100vh;place-content:center}main{width:min(100vw,1600px)}canvas{display:block;width:100%;aspect-ratio:16/9}footer{display:flex;align-items:center;gap:20px;padding:20px 28px;font-size:12px;color:#b4b4ac}button{background:#222221;border:1px solid #44443f;border-radius:6px;padding:8px 16px;color:#ecece8;cursor:pointer}input{flex:1;accent-color:#93a4f4}button:focus-visible,input:focus-visible{outline:2px solid #93a4f4;outline-offset:4px}small{display:block;padding:0 28px 20px;color:#b4b4ac} @media(max-width:600px){footer{gap:8px;padding:12px}small{padding:0 12px 12px}}
</style>
<main><canvas id="film" width="1920" height="1080" aria-label="砚品牌展示片：从想法、执行到成果的六段代码动画"></canvas><footer><button id="play">播放</button><button id="restart">重播</button><input id="seek" aria-label="影片时间轴" type="range" min="0" max="48" step="0.01" value="0"><span id="time">00:00 / 00:48</span><button id="full">全屏</button></footer><small>Inkstone · 设计展示 / 界面与任务均为演示内容。空格播放或暂停，方向键前后 1 秒。MP4 版本附原创合成配乐。</small></main>
<script src="film.js"></script></html>
