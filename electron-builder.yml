appId: com.yudatoux.yan
publish:
  provider: github
  owner: Yu-DaTouX
  repo: Inkstone
productName: 砚
copyright: Copyright © 2026 Yu-DaTouX

protocols:
  - name: Inkstone Deep Link
    schemes: [inkstone]

directories:
  output: release
  buildResources: build

files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - build/icon.png
  - build/icon.ico
  - build/tray/**
  - package.json
  - '!node_modules/**'
  - 'node_modules/node-pty/**'
  - 'node_modules/@ff-labs/fff-node/**'
  - 'node_modules/@ff-labs/fff-bin-*/**'
  - 'node_modules/ffi-rs/**'
  - 'node_modules/@yuuang/ffi-rs-*/**'
  - '!out/test/**'
  - '!**/*.{map,md,ts,tsx,tsbuildinfo}'

extraResources:
  - from: resources/browser-cookie-bridge
    to: browser-cookie-bridge
    filter: ['**/*']
  - from: integrations/hermes-inkstone
    to: integrations/hermes-inkstone
    filter: ['plugin.yaml', '__init__.py', 'client.py', 'approvals.py', 'connect.py']
  - from: resources/pi-runtime/dist
    to: pi-runtime/dist
    filter: ['**/*']
  - from: resources/pi-runtime/node_modules
    to: pi-runtime/node_modules
    filter: ['**/*']
  - from: resources/pi-runtime/package.json
    to: pi-runtime/package.json
  - from: resources/pi-extensions
    to: yan-thin
    filter: ['**/*']
  - from: resources/skills
    to: yan-skills
    filter: ['**/*']
  - from: resources/yan-cli
    to: yan-cli
    filter: ['**/*']
  - from: resources/search-tools
    to: search-tools
    filter: ['rg.exe', 'fd.exe', 'rg', 'fd']
  - from: resources/bot-icons
    to: bot-icons
    filter: ['*.png']
  - from: resources/desktop-pet
    to: desktop-pet
    filter: ['**/*.mjs']

asar: true
beforePack: scripts/pi-runtime-before-pack.cjs
compression: normal

npmRebuild: false

asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@ff-labs/**
  - node_modules/ffi-rs/**
  - node_modules/@yuuang/**

win:
  artifactName: ${productName}-${version}-portable-fast.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 砚
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
