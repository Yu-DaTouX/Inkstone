import groovy.json.JsonOutput

gradle.projectsEvaluated {
	gradle.rootProject.allprojects { p ->
		def run = p.tasks.findByName('runClient')
		if (run == null || p.tasks.findByName('inkstoneLaunchSpec') != null) return
		def sourceSets = p.extensions.findByName('sourceSets')
		p.tasks.register('inkstoneLaunchSpec') { t ->
			t.group = 'inkstone'
			t.dependsOn(run.taskDependencies)
			t.notCompatibleWithConfigurationCache('reads runClient internals')
			t.doLast {
				def out = new File(System.getProperty('inkstone.specOut'))
				def jvm = []
				jvm.addAll(run.internalJvmArgs.get())
				jvm.addAll(run.jvmArgs ?: [])
				run.systemProperties.each { k, v -> jvm.add("-D${k}=${v}".toString()) }
				def sets = []
				sourceSets?.each { ss ->
					if (ss.name.toLowerCase().contains('test')) return
					sets.add([
						name: ss.name,
						classesDirs: ss.output.classesDirs.files.collect { it.absolutePath },
						resourcesDir: ss.output.resourcesDir?.absolutePath,
						sourceDirs: ss.allSource.srcDirs.collect { it.absolutePath },
						classesTask: (p.path == ':' ? ':' : p.path + ':') + ss.classesTaskName,
						resourcesTask: (p.path == ':' ? ':' : p.path + ':') + ss.processResourcesTaskName
					])
				}
				def launcher = null
				try {
					if (run.javaLauncher.isPresent()) launcher = run.javaLauncher.get().executablePath.asFile.absolutePath
				} catch (ignored) {
				}
				out.parentFile.mkdirs()
				out.text = JsonOutput.prettyPrint(JsonOutput.toJson([
					project: p.path,
					projectDir: p.projectDir.absolutePath,
					mainClass: run.mainClass.get(),
					classpath: run.internalClasspath.files.collect { it.absolutePath },
					jvmArgs: jvm,
					args: run.args ?: [],
					workingDir: run.internalRunDir.get().asFile.absolutePath,
					environment: run.internalEnvironmentVars.get().collectEntries { k, v -> [(k): String.valueOf(v)] },
					javaLauncher: launcher,
					minecraftVersion: p.findProperty('minecraft_version'),
					gradleVersion: p.gradle.gradleVersion,
					sourceSets: sets
				]))
			}
		}
	}
}
