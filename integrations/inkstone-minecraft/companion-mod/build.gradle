plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = 'dev.inkstone'

base {
	archivesName = 'inkstone-companion'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

sourceSets {
	issues {
		java.srcDir 'core/src/test/java'
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
	main {
		java {
			srcDir 'core/src/main/java'
		}
	}
}

tasks.register('testIssues', JavaExec) {
	dependsOn issuesClasses
	classpath = sourceSets.issues.runtimeClasspath
	mainClass = 'dev.inkstone.companion.core.CompanionIssuesTest'
	systemProperty 'java.awt.headless', 'true'
	if (project.hasProperty('issueEvidence')) systemProperty 'inkstone.test.evidence', project.property('issueEvidence')
}

check.dependsOn testIssues

loom {
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = 'inkstone-companion-refmap.json'
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
